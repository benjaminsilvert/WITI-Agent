#!/usr/sbin/nft -f
flush ruleset

table ip nat {
    chain postrouting {
        type nat hook postrouting priority srcnat; policy accept;
        oifname "eth0" masquerade
    }
}

table ip filter {
    chain forward {
        type filter hook forward priority filter; policy drop;

        # Allow replies to connections the builder already established
        ct state established,related accept

        # Allow DNS (name lookups) out over IPv4
        ip daddr { 1.1.1.1, 8.8.8.8 } udp dport 53 accept
        ip daddr { 1.1.1.1, 8.8.8.8 } tcp dport 53 accept
	
	# Allow HTTPS only from the lab (eth1) to the internet (eth0), only to Anthropic's published range (API + login). Everything else stays dropped. 
	iifname "eth1" oifname "eth0" ip daddr 160.79.104.0/23 tcp dport 443 accept comment "Anthropic published range, checked 2026-09-16"
    }
}

table ip6 filter {
    chain forward {
        type filter hook forward priority filter; policy drop;
        # No accepts: all forwarded IPv6 is dropped, explicitly closing the v6 bypass.
    }
}
